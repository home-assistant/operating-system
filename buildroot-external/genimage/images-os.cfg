image kernel.img {
	size = ${KERNEL_SIZE}
	srcpath = "${BINARIES_DIR:-PLEASE_SPECIFY_BINARIES_DIR}/${KERNEL_FILE:-PLEASE_SPECIFY_KERNEL_FILE}"

	squashfs {
		compression = "lzo"
		block-size = 131072
	}
}

image overlay.f2fs {
	size = ${OVERLAY_SIZE}
	empty = "yes"

	f2fs {
		label = "hassos-overlay"
		extraargs = "-O extra_attr,inode_checksum,sb_checksum,flexible_inline_xattr"
	}
}
