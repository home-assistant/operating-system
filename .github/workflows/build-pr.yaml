# Build and test the OVA image for Renovate PRs that update the kernel, OS Agent, tempio or the test requirements

name: OS build (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "buildroot-external/configs/*_defconfig"
      - "buildroot-external/package/os-agent/os-agent.mk"
      - "buildroot-external/package/tempio/tempio.mk"
      - "tests/requirements.txt"

jobs:
  build:
    name: Build OVA
    # Fork PRs get a read-only token and can't push the builder image.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: read
    uses: ./.github/workflows/build.yaml
    with:
      boards: ova
      publish: false
      run_tests: true
